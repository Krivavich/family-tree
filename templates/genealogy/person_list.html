{% extends "base.html" %}
{% block content %}
<h1>Люди в дереве</h1>
{% for person in object_list %}
  <div class="card">
    <strong>{{ person }}</strong><br>
    Приватность: {{ person.get_privacy_display }}<br>
    <a href="/persons/{{ person.id }}/edit/">Редактировать</a>
    <a href="/persons/{{ person.id }}/delete/" class="btn btn-danger">Удалить</a>
  </div>
{% empty %}
  <div class="card">Пока нет людей. Добавьте первого участника семьи.</div>
{% endfor %}
{% endblock %}
