<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Family Tree{% endblock %}</title>
  <style>
    :root { --bg:#0f172a; --surface:#111827; --surface-soft:#1f2937; --text:#e5e7eb; --muted:#94a3b8; --accent:#22c55e; --danger:#ef4444; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: Inter, system-ui, Arial, sans-serif; background:linear-gradient(180deg,#0f172a,#020617); color:var(--text); }
    .container { max-width: 980px; margin: 0 auto; padding: 24px; }
    .nav { display:flex; gap:10px; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .nav-links { display:flex; gap:10px; flex-wrap:wrap; }
    .card { background:rgba(17,24,39,.9); border:1px solid rgba(148,163,184,.2); border-radius:16px; padding:16px; margin-bottom:12px; }
    .btn { border:none; background:var(--accent); color:#052e16; padding:8px 14px; border-radius:999px; text-decoration:none; font-weight:600; cursor:pointer; }
    .btn-danger { background:var(--danger); color:white; }
    .btn-soft { background:var(--surface-soft); color:var(--text); }
    .muted { color:var(--muted); }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    form p { display:flex; flex-direction:column; gap:6px; }
    input, select, textarea { border-radius:10px; border:1px solid #334155; background:#0b1220; color:var(--text); padding:10px; }
    a { color:#86efac; }
  </style>
</head>
<body>
  <main class="container">
    <div class="nav card">
      <div>
        <h2 style="margin:0">🌳 Family Tree</h2>
        <div class="muted">Совместное семейное древо и архив</div>
      </div>
      <div class="nav-links">
        <a href="/" class="btn btn-soft">Люди</a>
        <a href="/relationships/" class="btn btn-soft">Связи</a>
        <a href="/persons/new/" class="btn">+ Человек</a>
        {% if request.user.is_authenticated %}
          <form method="post" action="/accounts/logout/">{% csrf_token %}<button class="btn btn-soft" type="submit">Выход</button></form>
        {% endif %}
      </div>
    </div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
