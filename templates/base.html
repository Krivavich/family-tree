<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Family Tree{% endblock %}</title>
  <style>
    :root {
      --text:#e6f0ff;
      --muted:#b4c2df;
      --accent:#6ee7ff;
      --accent-2:#8b5cf6;
      --danger:#ef4444;
      --glass:rgba(255,255,255,.10);
      --stroke:rgba(255,255,255,.24);
    }
    * { box-sizing: border-box; }
    body {
      margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color:var(--text); min-height:100vh;
      background:
        radial-gradient(1200px 500px at 0% -10%, rgba(56,189,248,.28), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(139,92,246,.26), transparent 50%),
        radial-gradient(600px 400px at 50% 110%, rgba(16,185,129,.20), transparent 45%),
        linear-gradient(140deg,#0b1020,#111933 55%,#0b1020);
    }
    .bg-blob { position: fixed; filter: blur(50px); opacity: .55; pointer-events:none; z-index:0; border-radius: 999px; }
    .blob-a { width:320px; height:320px; background:#38bdf8; top:8%; left:-40px; }
    .blob-b { width:280px; height:280px; background:#8b5cf6; top:18%; right:-30px; }
    .blob-c { width:260px; height:260px; background:#10b981; bottom:6%; left:35%; }

    .container { max-width: 1080px; margin:0 auto; padding:24px; position:relative; z-index:1; }
    .glass { background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.06)); border: 1px solid var(--stroke); box-shadow: 0 14px 40px rgba(0,0,0,.28), inset 0 1px 1px rgba(255,255,255,.25); backdrop-filter: blur(18px) saturate(130%); -webkit-backdrop-filter: blur(18px) saturate(130%); border-radius: 24px; }
    .nav { display:flex; gap:12px; align-items:center; justify-content:space-between; margin-bottom:18px; padding:18px; }
    .nav-links { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

    .btn { border:none; border-radius:999px; padding:10px 14px; color:#eff8ff; text-decoration:none; font-weight:700; cursor:pointer; background:linear-gradient(140deg, rgba(110,231,255,.45), rgba(139,92,246,.42)); border:1px solid rgba(255,255,255,.25); box-shadow: inset 0 1px 1px rgba(255,255,255,.28), 0 6px 16px rgba(0,0,0,.22); }
    .btn:hover { transform: translateY(-1px); }
    .btn-soft { background:var(--glass); }
    .btn-danger { background:linear-gradient(140deg, rgba(248,113,113,.75), rgba(239,68,68,.75)); }

    .muted { color:var(--muted); }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .card { padding:16px; margin-bottom:14px; }
    .badge { display:inline-block; font-size:.8rem; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.2); }
    .progress { height:8px; border-radius:999px; background:rgba(255,255,255,.15); overflow:hidden; min-width:160px; }
    .progress > span { display:block; height:100%; background:linear-gradient(90deg,#22d3ee,#a78bfa); }

    form p { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
    input, select, textarea { border-radius:14px; border:1px solid rgba(255,255,255,.25); background:rgba(12,18,35,.45); color:var(--text); padding:11px 12px; outline:none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(110,231,255,.2); }
    a { color:#c7f9ff; }
  </style>
</head>
<body>
  <div class="bg-blob blob-a"></div>
  <div class="bg-blob blob-b"></div>
  <div class="bg-blob blob-c"></div>

  <main class="container">
    <div class="nav glass">
      <div>
        <h2 style="margin:0">🌳 Family Tree</h2>
        <div class="muted">Совместное семейное древо, архив и история рода</div>
      </div>
      <div class="nav-links">
        <a href="/" class="btn btn-soft">Люди</a>
        <a href="/relationships/" class="btn btn-soft">Связи</a>
        <a href="/events/" class="btn btn-soft">Таймлайн</a>
        <a href="/persons/new/" class="btn">+ Человек</a>
        <a href="/events/new/" class="btn btn-soft">+ Событие</a>
        {% if request.user.is_authenticated %}
          <form method="post" action="/accounts/logout/">{% csrf_token %}<button class="btn btn-soft" type="submit">Выход</button></form>
        {% endif %}
      </div>
    </div>
    {% block content %}{% endblock %}
    <footer class="muted" style="margin-top:18px;text-align:center;">© Krivavich · <a href="https://github.com/Krivavich" target="_blank" rel="noopener noreferrer">GitHub</a></footer>
  </main>
</body>
</html>
