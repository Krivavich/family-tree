{% extends "base.html" %}
{% block title %}Вход | Family Tree{% endblock %}
{% block content %}
<div class="card glass" style="max-width:460px;margin:0 auto;">
  <h1>Вход</h1>
  <p class="muted">Войдите, чтобы управлять деревьями и родственными связями.</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Войти</button>
  </form>
</div>
{% endblock %}
